name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── 1. Backend tests ────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: questly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: server

      - name: Audit backend dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: server

      - name: Create test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE questly_test;"
        env:
          PGPASSWORD: postgres

      - name: Run migrations (test DB)
        run: npm run migrate:test
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: questly_dev
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_TEST_NAME: questly_test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d
          PORT: 3001
          FRONTEND_URL: http://localhost:5173

      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: questly_dev
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_TEST_NAME: questly_test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d
          PORT: 3001
          FRONTEND_URL: http://localhost:5173

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 14

  # ── 2. Frontend tests ───────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  # ── 3. E2E tests ────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:15.18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: questly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install all deps
        run: |
          npm ci
          npm ci --prefix server

      - name: Run migrations
        run: npm run migrate
        working-directory: server
        env:
          NODE_ENV: development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: questly_dev
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d
          PORT: 3001
          FRONTEND_URL: http://localhost:5173

      - name: Start backend
        run: node index.js &
        working-directory: server
        env:
          NODE_ENV: development
          E2E_SEED_ENABLED: 'true'
          MULTI_WORKSPACE: 'false'
          # Keep rate limiters on; raise ceilings for seed-heavy Playwright register/login.
          RATE_LIMIT_LOGIN_MAX: '1000'
          RATE_LIMIT_REGISTER_MAX: '1000'
          RATE_LIMIT_JIRA_CONNECT_MAX: '1000'
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: questly_dev
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d
          PORT: 3001
          FRONTEND_URL: http://localhost:5173

      - name: Build frontend
        run: npm run build
        env:
          # Baked into the Vite bundle at build time — static serve has no /api proxy.
          VITE_API_URL: http://localhost:3001

      - name: Start frontend
        run: npx serve -s dist -l 5173 &

      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:3001/api/health --timeout 120000

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --pass-with-no-tests

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: playwright-report/

  # ── Deploy (push to main only, after all tests pass) ────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not configured — skipping deploy"
            exit 0
          fi
          npx vercel --prod --token "$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not configured — skipping deploy"
            exit 0
          fi
          npx @railway/cli up --service questly-server

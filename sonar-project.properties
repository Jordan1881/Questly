sonar.projectKey=questly
sonar.projectName=Questly
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://127.0.0.1:9000

# App + API source. Tests are listed separately so they don't count as production code.
sonar.sources=src,server
sonar.tests=src/tests,server/tests,e2e

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/uploads/**,\
  src/tests/**,\
  server/tests/**,\
  server/migrations/**,\
  server/seeds/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.min.js

sonar.test.inclusions=\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js

# Optional: picked up when present. Scanner warns and continues if a file is missing.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,server/coverage/lcov.info
